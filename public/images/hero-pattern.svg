<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

    <defs>

        <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d5162f" stop-opacity=".10"/>
            <stop offset="100%" stop-color="#d5162f" stop-opacity=".02"/>
        </linearGradient>

    </defs>

    <!-- Líneas diagonales -->

    <g opacity=".05" stroke="white" stroke-width="1">

        <line x1="0" y1="220" x2="520" y2="740"/>
        <line x1="250" y1="0" x2="1100" y2="850"/>
        <line x1="1100" y1="0" x2="1820" y2="720"/>
        <line x1="1420" y1="0" x2="1920" y2="500"/>

    </g>

    <!-- Circuitos -->

    <g opacity=".14"
       stroke="white"
       stroke-width="2"
       fill="none">

        <path d="M140 250 H500 V390 H760"/>

        <path d="M960 140
                 V430
                 H1320
                 V700
                 H1700"/>

        <path d="M250 840
                 H720
                 V930
                 H1110"/>

        <path d="M1450 160
                 H1750
                 V360
                 H1600"/>

    </g>

    <!-- Líneas rojas -->

    <g stroke="url(#redLine)"
       stroke-width="3"
       fill="none">

        <path d="M520 390 H760"/>

        <path d="M1320 430 V700"/>

        <path d="M720 930 H1110"/>

    </g>

    <!-- Nodos -->

    <g>

        <circle cx="140" cy="250" r="5" fill="white" opacity=".22"/>
        <circle cx="500" cy="250" r="5" fill="#d5162f"/>
        <circle cx="760" cy="390" r="5" fill="white" opacity=".25"/>

        <circle cx="960" cy="140" r="5" fill="#d5162f"/>
        <circle cx="1320" cy="430" r="5" fill="white" opacity=".25"/>
        <circle cx="1700" cy="700" r="5" fill="#d5162f"/>

        <circle cx="250" cy="840" r="5" fill="white" opacity=".20"/>
        <circle cx="720" cy="930" r="5" fill="#d5162f"/>
        <circle cx="1110" cy="930" r="5" fill="white" opacity=".20"/>

        <circle cx="1450" cy="160" r="5" fill="#d5162f"/>
        <circle cx="1600" cy="360" r="5" fill="white" opacity=".25"/>

    </g>

</svg>